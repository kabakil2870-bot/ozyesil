<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <style>
    .serif-title { font-family: 'Playfair Display', 'Times New Roman', serif; font-weight: 800; fill: #1B4D2E; font-size: 58px; letter-spacing: 6px; }
    .gold-subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: #C49A45; font-size: 22px; letter-spacing: 8px; }
    .tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #1B4D2E; font-size: 14px; letter-spacing: 4px; }
  </style>

  <!-- ÖZYEŞİL Title -->
  <text x="250" y="65" text-anchor="middle" class="serif-title">ÖZYEŞİL</text>

  <!-- Golden Lines and KOZMETİK -->
  <line x1="50" y1="95" x2="140" y2="95" stroke="#C49A45" stroke-width="2" />
  <text x="250" y="102" text-anchor="middle" class="gold-subtitle">KOZMETİK</text>
  <line x1="360" y1="95" x2="450" y2="95" stroke="#C49A45" stroke-width="2" />

  <!-- Tagline -->
  <text x="250" y="135" text-anchor="middle" class="tagline">DOĞAL GÜZELLİK, SAĞLIKLI SEN</text>

  <!-- Bottom Leaf Decoration -->
  <line x1="120" y1="165" x2="220" y2="165" stroke="#1B4D2E" stroke-width="1" opacity="0.5" />
  <g transform="translate(238, 150) scale(1)">
    <path fill="#1B4D2E" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.5c-2.8 0-5-2.2-5-5 0-1.8 1-3.4 2.5-4.2.3-.2.7 0 .6.4-.3.9-.1 2 .6 2.7.7.7 1.8.9 2.7.6.4-.1.6.3.4.6-.8 1.5-2.4 2.5-4.2 2.5z"/>
  </g>
  <line x1="280" y1="165" x2="380" y2="165" stroke="#1B4D2E" stroke-width="1" opacity="0.5" />
</svg>
